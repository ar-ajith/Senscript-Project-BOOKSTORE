<!-- convert_currency.html -->
<div class="modal-body">
  <div class="modal-box">
    <h2> Currency  💱 Converter</h2>

    <label for="amount">Amount in INR:</label>
    <input type="number" id="amount" placeholder="Enter amount in INR">

    <label for="currency">Convert to:</label>
    <select id="currency">
        <option value="USD">USD - US Dollar</option>
        <option value="EUR">EUR - Euro</option>
        <option value="GBP">GBP - British Pound</option>
        <option value="JPY">JPY - Japanese Yen</option>
    </select>

    <button onclick="convertCurrency()">Convert</button>

    <div id="convertedResult"></div>
  </div>
</div>

<style>
  .modal-body {
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100%;
  }

  .modal-box {
    background: #ffffff;
    padding: 30px 25px;
    border-radius: 12px;
    width: 100%;
    max-width: 400px;
    box-shadow: 0 12px 24px rgba(0, 0, 0, 0.2);
    animation: fadeIn 0.3s ease-in-out;
    position: relative;
  }

  .modal-box h2 {
    text-align: center;
    color: #333;
    margin-bottom: 20px;
  }

  .modal-box label {
    display: block;
    margin-top: 15px;
    font-weight: bold;
    color: #444;
  }

  .modal-box input,
  .modal-box select {
    width: 100%;
    padding: 10px;
    margin-top: 5px;
    border: 1px solid #ccc;
    border-radius: 6px;
    outline: none;
    transition: border 0.2s ease;
  }

  .modal-box input:focus,
  .modal-box select:focus {
    border-color: #007bff;
  }

  .modal-box button {
    width: 100%;
    margin-top: 20px;
    padding: 12px;
    background-color: #007bff;
    color: white;
    border: none;
    border-radius: 6px;
    cursor: pointer;
    font-weight: bold;
    transition: background 0.3s ease;
  }

  .modal-box button:hover {
    background-color: #0056b3;
  }

  #convertedResult {
    text-align: center;
    font-weight: bold;
    color: #333;
    margin-top: 20px;
    padding: 10px;
    background: #f5f5f5;
    border-radius: 6px;
  }

  @keyframes fadeIn {
    from { transform: translateY(20px); opacity: 0; }
    to { transform: translateY(0); opacity: 1; }
  }
</style>
