<div id="chatPopup" style="position: fixed; bottom: 90px; right: 20px; width: 300px; background: white; border: 1px solid #ccc; border-radius: 10px; z-index: 10000; box-shadow: 0 0 10px rgba(0,0,0,0.2);">
  <div style="background: #333; color: white; padding: 10px; border-radius: 10px 10px 0 0;">
    <strong>Chat with Admin</strong>
    <span onclick="document.getElementById('chatPopup').style.display='none'" style="float: right; cursor: pointer;">&times;</span>
  </div>
  <div id="chat-log" style="max-height: 300px; overflow-y: auto; padding: 10px; display: flex; flex-direction: column; gap: 8px;">
    {% for msg in messages %}
      {% if msg.sender.id == request.user.id %}
        <div class="message message-right">
          <strong>You</strong> {{ msg.message }}
        </div>
      {% else %}
        <div class="message message-left">
          <strong>{{ msg.sender.first_name }}</strong> {{ msg.message }}
        </div>
      {% endif %}
    {% endfor %}
  </div>
  <div style="padding: 10px; display: flex;">
    <input id="chat-message-input" type="text" placeholder="Type a message..." style="flex: 1; border: 1px solid #ccc; border-radius: 5px; padding: 5px;">
    <button onclick="sendMessage()" style="margin-left: 5px;">Send</button>
  </div>
</div>

<script>
  const roomName = "{{ room_name }}";
  const senderId = "{{ request.user.id }}";
  const chatSocket = new WebSocket(`ws://${window.location.host}/ws/chat/${roomName}/`);

  chatSocket.onmessage = function (e) {
    const data = JSON.parse(e.data);

    if (!data.message || !data.sender_id || !data.sender_name) return;

    const log = document.getElementById('chat-log');
    const isCurrentUser = data.sender_id == senderId;

    const msgDiv = document.createElement("div");
    msgDiv.className = `message ${isCurrentUser ? 'message-right' : 'message-left'}`;
    msgDiv.innerHTML = `<strong>${isCurrentUser ? 'You' : data.sender_name}</strong> ${data.message}`;
    log.appendChild(msgDiv);
    log.scrollTop = log.scrollHeight;
  };

  function sendMessage() {
    const input = document.getElementById("chat-message-input");
    const message = input.value.trim();
    if (!message) return;

    chatSocket.send(JSON.stringify({
      'message': message,
      'sender_id': senderId
    }));
    input.value = '';
  }
</script>



<style>
  .message {
    max-width: 80%;
    padding: 8px 12px;
    border-radius: 12px;
    font-size: 14px;
    word-wrap: break-word;
  }

  .message-left {
    align-self: flex-start;
    background-color: #e9ecef;
    border-top-left-radius: 0;
  }

  .message-right {
    align-self: flex-end;
    background-color: #007bff;
    color: white;
    border-top-right-radius: 0;
  }

  .message strong {
    display: block;
    margin-bottom: 4px;
  }
</style>
